name: Verify offline mock
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify mock engine and platform builds
        run: bash gradlew :mockEngine:desktopTest :composeApp:desktopTest :composeApp:compileKotlinDesktop :composeApp:assembleDebug :composeApp:lintDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-validation
          path: |
            mockEngine/build/reports/tests/
            composeApp/build/reports/
            composeApp/build/outputs/apk/debug/*.apk
